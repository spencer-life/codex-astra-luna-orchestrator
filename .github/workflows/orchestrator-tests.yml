name: Orchestrator source and tests

on:
  pull_request:
    branches: [personal]
  push:
    branches: [personal]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest tomlkit==0.15.1 PyYAML==6.0.3
      - name: Validate orchestrator source
        run: python scripts/orchestrator_sync.py validate
      - name: Validate Terra experiment source
        run: python scripts/terra_orchestrator.py validate
      - name: Run stable and experimental tests
        run: python -m pytest -q tests/test_orchestrator_sync.py tests/test_routing_migration.py tests/test_token_usage.py tests/test_usage_metrics.py tests/test_terra_orchestrator.py
